<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <style>text{font-family:'IPAGothic','IPAPGothic','WenQuanYi Zen Hei',sans-serif;}</style>
  <rect width="1280" height="720" fill="#FFFFFF"/>
  <rect x="0" y="0" width="1280" height="110" fill="#1B2A4A"/>
  <text x="640" y="72" text-anchor="middle" font-size="46" font-weight="bold" fill="#FFFFFF">志望動機は、この順で書く</text>
  <!-- 3 boxes -->
  <g>
    <rect x="60" y="180" width="330" height="330" rx="20" fill="#FFF4DD" stroke="#F2B33D" stroke-width="5"/>
    <circle cx="225" cy="180" r="38" fill="#F2B33D"/>
    <text x="225" y="195" text-anchor="middle" font-size="40" font-weight="bold" fill="#1B2A4A">1</text>
    <text x="225" y="300" text-anchor="middle" font-size="42" font-weight="bold" fill="#1B2A4A">入社後に</text>
    <text x="225" y="356" text-anchor="middle" font-size="42" font-weight="bold" fill="#1B2A4A">やりたいこと</text>
    <text x="225" y="440" text-anchor="middle" font-size="28" fill="#1B2A4A">1つだけ決める</text>
  </g>
  <path d="M405 345 l40 0 l0 -24 l40 39 l-40 39 l0 -24 l-40 0 z" fill="#1B2A4A"/>
  <g>
    <rect x="495" y="180" width="330" height="330" rx="20" fill="#EEF1F6" stroke="#1B2A4A" stroke-width="5"/>
    <circle cx="660" cy="180" r="38" fill="#1B2A4A"/>
    <text x="660" y="195" text-anchor="middle" font-size="40" font-weight="bold" fill="#FFFFFF">2</text>
    <text x="660" y="300" text-anchor="middle" font-size="42" font-weight="bold" fill="#1B2A4A">自分の経験</text>
    <text x="660" y="440" text-anchor="middle" font-size="28" fill="#1B2A4A">大きさは問わない</text>
  </g>
  <path d="M840 345 l40 0 l0 -24 l40 39 l-40 39 l0 -24 l-40 0 z" fill="#1B2A4A"/>
  <g>
    <rect x="930" y="180" width="290" height="330" rx="20" fill="#FFF4DD" stroke="#F2B33D" stroke-width="5"/>
    <circle cx="1075" cy="180" r="38" fill="#F2B33D"/>
    <text x="1075" y="195" text-anchor="middle" font-size="40" font-weight="bold" fill="#1B2A4A">3</text>
    <text x="1075" y="300" text-anchor="middle" font-size="42" font-weight="bold" fill="#1B2A4A">どう活きるか</text>
    <text x="1075" y="440" text-anchor="middle" font-size="28" fill="#1B2A4A">1と2をつなぐ</text>
  </g>
  <!-- bottom note -->
  <rect x="60" y="570" width="1160" height="100" rx="16" fill="#1B2A4A"/>
  <text x="640" y="634" text-anchor="middle" font-size="36" font-weight="bold" fill="#FFFFFF">「興味があります」で終わらせない</text>
</svg>
