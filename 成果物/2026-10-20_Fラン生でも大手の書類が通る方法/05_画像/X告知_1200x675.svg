<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <style>text{font-family:'IPAGothic','IPAPGothic','WenQuanYi Zen Hei',sans-serif;}</style>
  <rect width="1200" height="675" fill="#1B2A4A"/>
  <rect x="50" y="50" width="1100" height="575" rx="24" fill="#FFFFFF"/>
  <text x="600" y="150" text-anchor="middle" font-size="36" font-weight="bold" fill="#1B2A4A">Fラン文系・約60社落ちた僕のES</text>
  <!-- 通らない -->
  <rect x="130" y="200" width="940" height="130" rx="16" fill="#EEF1F6"/>
  <text x="190" y="252" font-size="28" font-weight="bold" fill="#6B7A99">落ちていた頃</text>
  <text x="190" y="305" font-size="50" font-weight="bold" fill="#6B7A99">「興味があります」</text>
  <text x="1010" y="292" text-anchor="end" font-size="64" font-weight="bold" fill="#6B7A99">×</text>
  <!-- 矢印 -->
  <path d="M600 342 l-30 0 l30 34 l30 -34 z" fill="#F2B33D"/>
  <!-- 通る -->
  <rect x="130" y="388" width="940" height="150" rx="16" fill="#FFF4DD" stroke="#F2B33D" stroke-width="5"/>
  <text x="190" y="440" font-size="28" font-weight="bold" fill="#D9861C">通り始めた頃</text>
  <text x="190" y="505" font-size="56" font-weight="bold" fill="#1B2A4A">「入って何をしたいか」</text>
  <text x="1010" y="500" text-anchor="end" font-size="64" font-weight="bold" fill="#D9861C">○</text>
  <text x="600" y="592" text-anchor="middle" font-size="32" font-weight="bold" fill="#1B2A4A">通らないES・通るESを比較しました</text>
</svg>
