<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <style>text{font-family:'IPAGothic','IPAPGothic','WenQuanYi Zen Hei',sans-serif;}</style>
  <rect width="1200" height="675" fill="#1B2A4A"/>
  <rect x="50" y="50" width="1100" height="575" rx="24" fill="#FFFFFF"/>
  <!-- メイン -->
  <text x="600" y="300" text-anchor="middle" font-size="96" font-weight="bold" fill="#1B2A4A">「興味があります」</text>
  <text x="600" y="420" text-anchor="middle" font-size="96" font-weight="bold" fill="#1B2A4A">で落ちていた</text>
  <rect x="330" y="450" width="540" height="12" rx="6" fill="#F2B33D"/>
  <!-- 補助の一言 -->
  <text x="600" y="545" text-anchor="middle" font-size="40" font-weight="bold" fill="#D9861C">通り始めたESとの違い</text>
</svg>
